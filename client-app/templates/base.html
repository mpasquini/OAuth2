<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OAuth2 Demo{% endblock %} — Client App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0; padding: 0;
      background: #f8fafc; color: #1e293b;
      min-height: 100vh;
    }
    nav {
      background: #1e293b; color: #f1f5f9;
      padding: 0.75rem 1.5rem;
      display: flex; align-items: center; gap: 1rem;
    }
    nav .brand { font-weight: 700; font-size: 1rem; margin-right: auto; }
    nav a { color: #94a3b8; text-decoration: none; font-size: 0.875rem; }
    nav a:hover { color: #f1f5f9; }
    .container { max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
    .card {
      background: #fff; border: 1px solid #e2e8f0;
      border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1rem; color: #475569; margin: 0 0 1rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    .btn {
      display: inline-block; padding: 0.5rem 1.25rem;
      border-radius: 5px; font-size: 0.9rem;
      text-decoration: none; border: none; cursor: pointer;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover { background: #cbd5e1; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-danger:hover { background: #b91c1c; }
    .error-box {
      background: #fef2f2; border: 1px solid #fca5a5;
      border-radius: 6px; padding: 0.875rem 1rem;
      color: #991b1b; font-size: 0.9rem; margin-bottom: 1.5rem;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #f1f5f9; }
    th { color: #64748b; font-weight: 600; width: 40%; }
    td { font-family: ui-monospace, monospace; word-break: break-all; }
    code { background: #f1f5f9; padding: 0.1rem 0.35rem; border-radius: 3px; font-size: 0.85em; }
  </style>
</head>
<body>
<nav>
  <span class="brand">OAuth2 Demo</span>
  <a href="/">Home</a>
  {% if logged_in is defined and logged_in %}
    <a href="/profile">Profile</a>
    <a href="/logout">Logout</a>
  {% else %}
    <a href="/login">Login</a>
  {% endif %}
</nav>
<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
